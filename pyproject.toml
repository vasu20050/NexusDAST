[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusdast"
version = "1.0.0"
description = "Advanced Web Application Vulnerability Scanner"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "NexusDAST Team"}
]

dependencies = [
    "playwright>=1.47.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "PyYAML>=6.0",
    "lxml>=4.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["scanner"]

[tool.setuptools.package-dir]
"" = "backend"
